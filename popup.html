<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Coub Tweaks</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <header class="top">
        <div class="brand">
            <img class="logo" src="icons/icon48.png" alt="">
            <div class="titles">
                <div class="title">Coub Tweaks</div>
                <div class="subtitle" id="status">Включено</div>
            </div>
        </div>
        <label class="switch switch--master" title="Включить / выключить все твики">
            <input type="checkbox" id="enabled" data-key="enabled">
            <span class="track"><span class="thumb"></span></span>
        </label>
    </header>

    <main class="features" id="features">
        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Чистый плеер</span>
                <span class="feature__desc">Убирает затемнение и подсказки поверх видео</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="darkOverlay">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Фикс вёрстки</span>
                <span class="feature__desc">Плеер масштабируется и подстраивается под разрешение экрана</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="layout">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Резкость видео</span>
                <span class="feature__desc">Делает видео чётче без нагрузки (шейдерный фильтр)</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="sharpen">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Аватар аккаунта</span>
                <span class="feature__desc">В шапке показывает настоящий аватар канала вместо заглушки</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="avatar">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Автоскрытие меню</span>
                <span class="feature__desc">Сворачивает боковую панель на странице видео</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="sidebar">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="12" x2="18" y2="12"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Пробел — пауза</span>
                <span class="feature__desc">Пробел управляет воспроизведением</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="spaceKey">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Громкость</span>
                <span class="feature__desc">Слайдер при наведении и запоминание уровня</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="volume">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>

        <label class="feature">
            <span class="feature__icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </span>
            <span class="feature__text">
                <span class="feature__name">Скачивание</span>
                <span class="feature__desc">Кнопки «Скачать MP4» и «Слушать MP3»</span>
            </span>
            <span class="switch">
                <input type="checkbox" data-key="downloads">
                <span class="track"><span class="thumb"></span></span>
            </span>
        </label>
    </main>

    <footer class="foot">
        Изменения применяются сразу
    </footer>

    <script src="popup.js"></script>
</body>
</html>
